<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typething</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="shell">
      <div class="surface">
        <div class="drag-surface" data-tauri-drag-region></div>
        <section id="composer-panel" class="panel panel-compose" data-view="compose">
          <textarea
            id="composer"
            class="composer"
            placeholder="type stuff... drag anywhere. ⌘+enter to copy. ⌘+left/right for tabs. ⌘+, for settings"
            autofocus
          ></textarea>
          <div class="action-row">
            <button
              id="settings-button"
              class="action-button action-button-secondary"
              type="button"
              aria-label="Open settings"
              title="Open settings"
            ></button>
            <div id="tab-dots" class="tab-dots" aria-label="Note tabs"></div>
            <button
              id="copy-button"
              class="action-button"
              type="button"
              aria-label="Copy text to clipboard"
              title="Copy text to clipboard"
            ></button>
          </div>
        </section>
        <section
          id="settings-panel"
          class="panel panel-settings"
          data-view="settings"
          hidden
        >
          <button
            id="close-settings-button"
            class="action-button action-button-secondary settings-done-button"
            type="button"
          >
            Done
          </button>
          <div class="settings-center">
            <input
              id="shortcut-input"
              class="shortcut-input"
              type="text"
              readonly
              spellcheck="false"
            />
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
