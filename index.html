<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typething</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="shell">
      <div class="surface">
        <div class="drag-surface" data-tauri-drag-region></div>
        <section id="composer-panel" class="panel panel-compose" data-view="compose">
          <textarea
            id="composer"
            class="composer"
            placeholder="type stuff... drag anywhere. ⌘+enter to copy. ⌘+left/right for tabs. ⌘+, for settings"
            autofocus
          ></textarea>
          <div class="action-row">
            <button
              id="settings-button"
              class="action-button action-button-secondary"
              type="button"
              aria-label="Open settings"
              title="Open settings"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M10.7 2h2.6l.5 2.3c.6.2 1.1.4 1.7.7l2.1-1.1 1.8 1.8-1.1 2.1c.3.5.5 1.1.7 1.7L22 10.7v2.6l-2.3.5c-.2.6-.4 1.1-.7 1.7l1.1 2.1-1.8 1.8-2.1-1.1c-.5.3-1.1.5-1.7.7L13.3 22h-2.6l-.5-2.3c-.6-.2-1.1-.4-1.7-.7l-2.1 1.1-1.8-1.8 1.1-2.1c-.3-.5-.5-1.1-.7-1.7L2 13.3v-2.6l2.3-.5c.2-.6.4-1.1.7-1.7L3.9 6.4l1.8-1.8 2.1 1.1c.5-.3 1.1-.5 1.7-.7L10.7 2Zm1.3 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"
                  fill="currentColor"
                />
              </svg>
            </button>
            <div id="tab-dots" class="tab-dots" aria-label="Note tabs"></div>
            <button
              id="copy-button"
              class="action-button"
              type="button"
              aria-label="Copy text to clipboard"
              title="Copy text to clipboard"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M9 7.5A2.5 2.5 0 0 1 11.5 5h6A2.5 2.5 0 0 1 20 7.5v8a2.5 2.5 0 0 1-2.5 2.5h-6A2.5 2.5 0 0 1 9 15.5v-8Zm2.5-.5a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 .5.5h6a.5.5 0 0 0 .5-.5v-8a.5.5 0 0 0-.5-.5h-6ZM4 9.5A2.5 2.5 0 0 1 6.5 7H7v2h-.5a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 .5.5h6a.5.5 0 0 0 .5-.5V17h2v.5A2.5 2.5 0 0 1 12.5 20h-6A2.5 2.5 0 0 1 4 17.5v-8Z"
                  fill="currentColor"
                />
              </svg>
            </button>
          </div>
        </section>
        <section
          id="settings-panel"
          class="panel panel-settings"
          data-view="settings"
          hidden
        >
          <button
            id="close-settings-button"
            class="action-button action-button-secondary settings-done-button"
            type="button"
          >
            Done
          </button>
          <div class="settings-center">
            <input
              id="shortcut-input"
              class="shortcut-input"
              type="text"
              readonly
              spellcheck="false"
            />
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
